# Usage: python -m src.training.sft --config configs/sft.yaml --data <path> --run-name <name>

# Model
model_name: "Qwen/Qwen2.5-3B-Instruct"
max_seq_length: 2048

# QLoRA
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Training
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
optim: paged_adamw_8bit
bf16: false
fp16: true

# Validation
val_split: 0.1
seed: 42
eval_strategy: epoch

# Logging
logging_steps: 10
save_strategy: epoch
report_to: wandb

# Output
output_dir: checkpoints/sft
